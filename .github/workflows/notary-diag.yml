name: Notary diagnostic

# Manual-only diagnostic: authenticates against Apple's notary service with
# the same App Store Connect API key the release workflow uses, and prints
# the FULL notarytool error. The release build swallows this (electron's
# notarize wrapper JSON-parses the output, so failures surface only as
# "Unexpected token 'E' ... is not valid JSON"). Run this to see whether
# Apple is returning 401 (bad/revoked key), 403 (membership/agreement
# problem), or 500 (Apple-side outage).
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-14
    steps:
      - name: Write the notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api_key.p8"

      - name: Query notary history (auth check)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          xcrun notarytool history \
            --key "$RUNNER_TEMP/api_key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" 2>&1
          status=$?
          echo "notarytool exit code: $status"
          exit $status

      - name: Clean up the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/api_key.p8"
